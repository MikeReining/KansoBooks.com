definitions:
  - term: books readiness
    source: content/_data/canonical-jobs.yml
    safeDefinition: A period is ready when categorized transactions are supported by reconciliation status, evidence, review items, and accountant handoff outputs.
  - term: evidence trail
    source: docs/KansoBooksVision.md#trust-model
    safeDefinition: Source evidence, notes, and decisions that make a visible financial claim traceable and inspectable.
  - term: AI-drafted bookkeeping
    source: content/_truth/product.yml

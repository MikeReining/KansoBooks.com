    useLimit: short excerpt only
suggestedExamples:
  - A transaction can be categorized but still not ready if the statement balance has not been checked.
  - An unresolved difference can still be handoff-ready if it is explicitly named as an open item.
writerWarnings:
  - Avoid tax-time claims beyond handoff readiness.
  - Do not duplicate the accountant package page; this page owns the earlier question, "am I done?"
  - Prefer "books with an evidence trail" and "tax-time handoff ready" if tax-time language is needed.
  - Do not imply cloud storage or automatic AI truth.

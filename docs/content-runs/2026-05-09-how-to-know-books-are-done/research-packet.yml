  legal: Do not provide legal advice or entity-specific conclusions.
  audit: Do not promise audit outcomes or use audit as the readiness standard.
  accounting: Keep to general books-readiness workflow; route judgment calls to accountant review.
sourceExcerpts:
  - source: docs/content-engine/Vision.md
    excerpt: "Get the books ready. Know what is still uncertain. Send the accountant a package that explains itself."

  amIDone: The checklist defines the conditions for moving from bookkeeping work to accountant handoff.
  isThisRight: Reconciliation status, transaction states, and unusual-item notes show what was checked.
  canIProveIt: The evidence trail and source-file list show why the numbers can be inspected.

    source: https://quickbooks.intuit.com/online/
    sourceCheckedAt: 2026-06-04
    refresh: monthly
    notes: Supports the article's high-level QuickBooks Online framing without making pricing or plan claims.
  - id: claim-quickbooks-online-feature-scope
    text: Intuit's QuickBooks materials describe online accounting workflows such as bank connection, reconciliation support, reporting, payments, dashboards, batch work, custom reporting, and user roles.
    type: competitor
    source: https://quickbooks.intuit.com/oidam/intuit/sbseg/en_us/accountants/web/content/DTM-what-new-QBO-QBOAV-toolkit-QBO.pdf
    sourceCheckedAt: 2026-06-04
    refresh: monthly
    notes: Supports broad platform-scope language; article avoids plan-specific availability claims.
  - id: claim-local-first
    text: KansoBooks is local-first and the user's books live in files they own.
    type: product
    source: content/_truth/product.yml
    refresh: on-release

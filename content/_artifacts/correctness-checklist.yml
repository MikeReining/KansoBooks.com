professionalBoundary: This checklist helps organize owner-safe bookkeeping review. Ask your accountant before relying on it for filing, tax treatment, payroll, sales tax, audit, legal, or entity-specific matters.
owner: KansoBooks Editorial System
lastReviewed: 2026-05-13
nextReview: 2026-08-13
content:
  purpose: Help a busy owner see whether bookkeeping numbers are complete, checked, explainable, and ready for the next review step.
  useWhen:
    - You want to know whether reports are believable before relying on them.
    - You need to find the difference between clean-looking books and checked books.
    - You want AI-drafted bookkeeping reviewed before it becomes part of the record.
  doNotUseFor:
    - Choosing tax treatment, filing positions, payroll treatment, sales tax treatment, legal conclusions, audit conclusions, or entity-specific decisions.
    - Replacing accountant review.
    - Treating polished reports as correct without source files and balance checks.
  checklist:
    - name: Source files are present
      doneWhen: Every included bank, card, loan, and payment processor account has a statement or export.
      proof: Source-file list grouped by account and period.
    - name: Transactions are complete
      doneWhen: Transactions from included source files are present, or missing items are listed.
      proof: Import log, transaction count, source-file match, or exception list.
    - name: Balances are checked
      doneWhen: Ending balances tie to statements, or unresolved differences are named.
      proof: Reconciliation status and difference list.
    - name: Transfers are reviewed
      doneWhen: Transfers are paired or left as explicit review items.
      proof: Transfer match notes and unresolved transfer list.
    - name: Duplicates are reviewed
      doneWhen: Duplicate-looking transactions are removed, merged, or explained.
      proof: Duplicate review list.
    - name: Unusual items are explained
      doneWhen: Large, one-time, owner, loan, refund, personal-looking, or unclear items have notes or review states.
      proof: Exception list with notes, evidence, or questions.
    - name: Reports match the reviewed period
      doneWhen: P&L, balance sheet when applicable, and summaries use the same period and account scope.
      proof: Report files and scope note.
    - name: Open questions are visible
      doneWhen: Owner questions and accountant questions are written down before the books are relied on.
      proof: Open-question list.
  correctnessOutcome:
    - What source files support the numbers.
    - What was checked.
    - What still needs review.
    - Whether the books are ready for the next step.

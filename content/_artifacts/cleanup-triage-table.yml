schemaVersion: 1
id: cleanup-triage-table
title: Bookkeeping Cleanup Triage Table
artifactType: checklist
jurisdiction: general
risk: medium
sourceNotes:
  - docs/content-engine/CopyGuide.md
  - docs/KansoBooksVision.md#trust-model
  - content/_artifacts/accountant-package-checklist.yml
  - content/_artifacts/books-readiness-checklist.yml
  - content/_artifacts/monthly-close-checklist.yml
  - content/_truth/legal-boundaries.yml
professionalBoundary: This cleanup table helps organize owner-safe bookkeeping work before accountant review. Ask your accountant before relying on it for filing, tax treatment, payroll, sales tax, audit, legal, or entity-specific matters.
owner: KansoBooks Editorial System
lastReviewed: 2026-05-21
nextReview: 2026-08-21
content:
  purpose: Help a busy owner turn messy pre-season bookkeeping into a smaller, clearer accountant handoff problem.
  useWhen:
    - The books are behind, incomplete, or hard to trust before accountant handoff.
    - You need to decide what to clean first.
    - You want to separate owner-safe cleanup from accountant questions.
  doNotUseFor:
    - Choosing tax treatment, filing positions, payroll treatment, sales tax treatment, legal conclusions, audit conclusions, or entity-specific decisions.
    - Replacing accountant review.
    - Treating clean-looking reports as complete without source files and review notes.
  checklist:
    - name: Cleanup scope is named
      doneWhen: The cleanup has a start date, end date, and account list.
      proof: Scope note.
    - name: Source files are collected
      doneWhen: Every account in scope has a statement, export, report, or missing-file note.
      proof: Source-file list grouped by account and period.
    - name: Missing accounts are checked
      doneWhen: Bank, card, loan, cash, and payment processor accounts are included or explicitly out of scope.
      proof: Account coverage list.
    - name: Balances are reviewed
      doneWhen: Ending balances match statements where possible, or differences are named.
      proof: Reconciliation status and difference list.
    - name: Transfers are reviewed
      doneWhen: Transfers are paired or left as explicit review items.
      proof: Transfer match notes and unresolved transfer list.
    - name: Duplicates are reviewed
      doneWhen: Duplicate-looking transactions are removed, merged, or explained.
      proof: Duplicate review list.
    - name: Unusual items are explained
      doneWhen: Large, one-time, owner, loan, refund, personal-looking, or unclear items have notes or questions.
      proof: Exception list with notes, evidence, or accountant questions.
    - name: Open questions are packaged
      doneWhen: Unresolved owner and accountant questions are written down with supporting source files.
      proof: Handoff question list.
  cleanupOutcome:
    - Scope and account coverage.
    - Source files collected.
    - Reconciliation and exception notes.
    - Unusual items reviewed.
    - Accountant questions packaged.

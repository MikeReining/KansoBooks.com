schemaVersion: 1
id: reconciliation-status-table
title: Reconciliation Status Table
artifactType: checklist
jurisdiction: general
risk: medium
sourceNotes:
  - content/_artifacts/books-readiness-checklist.yml
  - content/_artifacts/monthly-close-checklist.yml
  - content/_artifacts/correctness-checklist.yml
  - content/_truth/legal-boundaries.yml
professionalBoundary: This table helps organize reconciliation status before relying on reports or sending books forward. Ask your accountant before relying on it for filing, tax treatment, payroll, sales tax, audit, legal, or entity-specific matters.
owner: KansoBooks Editorial System
lastReviewed: 2026-06-06
nextReview: 2026-09-06
content:
  purpose: Help a small-business owner classify unreconciled accounts by source file, balance difference, review status, and next action.
  useWhen:
    - A bank, card, loan, processor, or other source account is not reconciled.
    - Reports look clean but account balances have not been checked against statements.
    - The owner needs to package a reconciliation issue for accountant review.
  doNotUseFor:
    - Choosing tax treatment, filing positions, payroll treatment, sales tax treatment, legal conclusions, audit conclusions, or entity-specific decisions.
    - Replacing accountant review.
    - Treating unreconciled reports as final because categories look complete.
  checklist:
    - name: Account and period are named
      doneWhen: The affected account and date range are explicit.
      proof: Account name, period label, and included/excluded account note.
    - name: Source file status is known
      doneWhen: The statement or export is present, or a missing-source note is written.
      proof: Source file list or missing-source note.
    - name: Balance difference is recorded
      doneWhen: Statement balance, book balance, and difference are recorded when available.
      proof: Reconciliation note with balance figures or explicit unknown status.
    - name: Common workflow causes are checked
      doneWhen: Missing imports, duplicate imports, transfers, processor payouts, fees, refunds, and old cleanup notes have been reviewed where relevant.
      proof: Review notes and exception list.
    - name: Status is assigned
      doneWhen: The account is marked not started, source missing, in progress, difference found, needs transfer review, needs duplicate review, needs accountant, or reconciled for handoff.
      proof: Reconciliation status table.
    - name: Accountant question is written
      doneWhen: Any professional judgment item is written as a specific question tied to source files.
      proof: Accountant question list.
  reconciliationOutcome:
    - Account and period in scope.
    - Source file status.
    - Balance difference or unknown status.
    - Workflow checks attempted.
    - Owner and accountant questions.

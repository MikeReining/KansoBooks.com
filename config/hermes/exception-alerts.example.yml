version: 1
status: install-template-only
secrets: not-stored-in-repo

purpose: >
  Route blocked Hermes runs to a human-visible local alert without making
  founder approval a publishing gate.

defaultBehavior:
  onException:
    - write docs/content-runs/<run-id>/exception-report.yml
    - write local scheduler stderr/stdout
  founderApprovalGate: false

allowedLocalAlertChannels:
  - macOS notification from the dedicated Hermes OS user
  - local mail configured on the Mac Mini
  - append-only local log watched by the scheduler

optionalCredentialedChannels:
  - channel: GitHub issue or pull request comment
    credentialBoundary: least-privilege-content-automation-token
    allowedOnlyAfterHumanLocalSetup: true

forbiddenChannels:
  - Vercel admin notifications requiring deploy/admin token
  - Supabase project/admin notifications
  - Lemon Squeezy admin, billing, payout, or customer-data notifications
  - DNS provider notifications
  - channels that include customer books, statements, receipts, ledgers,
    accountant packages, or financial exports

minimumAlertPayload:
  - run id
  - failed gate
  - exception report path
  - git sha
  - narrow decision needed, if any

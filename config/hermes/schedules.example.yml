version: 1
status: install-template-only
timezone: America/Vancouver
runner: local-mac-mini

jobs:
  - id: hermes-dry-run
    cadence: daily
    suggestedCron: "15 6 * * *"
    profile: kanso-auditor-publisher
    command: HERMES_REPORT_ROOT=docs/content-runs npm run hermes:dry-run
    publishAllowed: false
    writes:
      - docs/content-runs/**

  - id: weekly-artifact-or-article
    cadence: weekly
    suggestedCron: "30 7 * * 2"
    profiles:
      - kanso-orchestrator
      - kanso-research
      - kanso-editor
      - kanso-auditor-publisher
    publishAllowed: after-all-gates-pass
    founderApprovalGate: false
    writes:
      - content/**
      - public/content/**
      - public/og/**
      - docs/content-runs/**

  - id: refresh-existing-content
    cadence: weekly
    suggestedCron: "45 7 * * 4"
    profiles:
      - kanso-orchestrator
      - kanso-research
      - kanso-editor
      - kanso-auditor-publisher
    publishAllowed: after-all-gates-pass
    writes:
      - content/**
      - docs/content-runs/**

  - id: metrics-review
    cadence: weekly
    suggestedCron: "0 8 * * 5"
    profile: kanso-orchestrator
    publishAllowed: false
    writes:
      - docs/content-runs/**
    requiresHumanLocalSetup:
      - read-only analytics source credentials if available
      - no ad account, billing, payment, or customer financial data access

scheduleInstallNotes:
  - Convert suggestedCron entries to launchd plists, crontab, or the scheduler Hermes supports locally.
  - Start with hermes-dry-run only until the Mac Mini worktree, local secrets, and permissions are verified.
  - Do not configure direct Vercel, Supabase, Lemon Squeezy, DNS, or GitHub admin credentials for these jobs.

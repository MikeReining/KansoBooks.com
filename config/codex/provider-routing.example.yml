version: 1
status: local-secrets-required
secrets: not-stored-in-repo

environmentVariablesExpectedOnMacMini:
  - CODEX_PROVIDER_ORCHESTRATION
  - CODEX_PROVIDER_RESEARCH
  - CODEX_PROVIDER_DRAFTING
  - CODEX_PROVIDER_AUDIT
  - CODEX_MODEL_ORCHESTRATION
  - CODEX_MODEL_RESEARCH
  - CODEX_MODEL_DRAFTING
  - CODEX_MODEL_AUDIT

routes:
  orchestration:
    providerEnv: CODEX_PROVIDER_ORCHESTRATION
    modelEnv: CODEX_MODEL_ORCHESTRATION
    requirements:
      - low-cost-planning
      - strong-instruction-following
      - no-production-credentials

  research:
    providerEnv: CODEX_PROVIDER_RESEARCH
    modelEnv: CODEX_MODEL_RESEARCH
    requirements:
      - web-capable-where-local-codex-supports-it
      - source-citation-discipline
      - conservative-tax-legal-boundary

  drafting:
    providerEnv: CODEX_PROVIDER_DRAFTING
    modelEnv: CODEX_MODEL_DRAFTING
    requirements:
      - strong-long-form-writing
      - Kanso-voice-preservation
      - no-cloud-books-implication

  audit:
    providerEnv: CODEX_PROVIDER_AUDIT
    modelEnv: CODEX_MODEL_AUDIT
    requirements:
      - strict-claim-checking
      - deterministic-gate-respect
      - escalation-on-uncertainty

localSecretStorage:
  recommended: macOS Keychain or Codex-supported local secret store
  forbidden:
    - repository files
    - .env files committed to git
    - docs/content-runs/**
    - screenshots or run logs
